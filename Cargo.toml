[package]
name = "coduck"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "multiple chatgpt accounts in one codex cli"
license = "MIT"
repository = "https://github.com/canu0205/coduck"
include = ["src/**", "assets/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tempfile = "3"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.dist]
inherits = "release"
lto = "thin"
